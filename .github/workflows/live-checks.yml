# Checks that need the public internet.
#
# These are split out of CI on purpose. They depend on hosts this repository
# does not control, so a failure here means "a live surface changed", not "this
# commit is bad" — mixing them into the per-commit checks would make a red tick
# stop meaning anything. They run on a schedule and can be started by hand.
name: Live checks

on:
  schedule:
    # The canary runs often because a resource that stops being gated, or a
    # price that drifts from the manifest, is a commerce bug and should not sit
    # for a week before anyone notices.
    - cron: '0 */6 * * *'
    # The link, entity and count audits are slower-moving and sweep more URLs.
    - cron: '0 13 * * 1'
  workflow_dispatch:
    inputs:
      suite:
        description: Which checks to run
        type: choice
        default: all
        options: [all, canary, links, entity, counts]

permissions:
  contents: read

jobs:
  canary:
    name: x402 / A2A runtime canary
    # Every schedule and every manual run except one that asked for a different suite.
    if: >-
      github.event_name != 'workflow_dispatch' ||
      contains(fromJSON('["all","canary"]'), inputs.suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe the advertised x402 resources
        run: npm run check:x402

  audits:
    name: Links, entity and counts
    # The six-hourly cron runs the canary alone; the weekly one runs everything.
    if: >-
      github.event.schedule == '0 13 * * 1' ||
      (github.event_name == 'workflow_dispatch' &&
       contains(fromJSON('["all","links","entity","counts"]'), inputs.suite))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve every published link
        if: inputs.suite == '' || contains(fromJSON('["all","links"]'), inputs.suite)
        run: npm run check:links

      - name: Audit the entity and agent surfaces
        if: inputs.suite == '' || contains(fromJSON('["all","entity"]'), inputs.suite)
        run: npm run check:entity

      # Count drift is reported, not enforced: upstream merges land on other
      # people's schedules, so this step surfaces the delta in the job summary
      # and only fails if a claim can no longer be found in the README at all.
      - name: Reconcile the numeric claims against GitHub
        if: inputs.suite == '' || contains(fromJSON('["all","counts"]'), inputs.suite)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run check:counts
